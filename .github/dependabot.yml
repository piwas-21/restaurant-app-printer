# Dependabot — SECURITY updates only (workspace CLAUDE.md standing decision:
# "Dependabot PRs are paused").
#
# `open-pull-requests-limit: 0` is the documented way to switch OFF version-update
# PRs while leaving Dependabot SECURITY updates fully on — which is why the file
# stays here instead of being deleted. The CVE gate is unchanged and, if anything,
# more load-bearing now: security-audit.yml runs osv_scanner, nuget_vuln_audit,
# trivy_fs and a full-history gitleaks weekly.
#
# Why: the decision not to merge these PRs was already taken, but the bot was still
# being paid to open them — measured over 34 days on this (private, billed) repo,
# 38 "Dependabot Updates" runs plus 29 CI runs on dependabot/* branches, ~90
# runner-minutes and ~174 billed minutes, for PRs that sat unmerged and rebasing.
# This makes the status quo honest rather than changing it. Version drift is the
# accepted cost, and it was already accruing.
#
# To resume version updates: raise the limits below (5 nuget / 3 actions were the
# previous values) in a PR that also says who will triage them.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0  # version-update PRs off; security updates unaffected
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # MAUI/.NET majors track the pinned workload + TFM (ADR-005 multi-target)
      # — coordinated upgrades, not dependency PRs.
      - dependency-name: "Microsoft.Maui.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0  # version-update PRs off; security updates unaffected
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
