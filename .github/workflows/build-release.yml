name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

# Releases publish to the PUBLIC piwas-21/printer-app-releases repo via RELEASES_REPO_TOKEN
# (a PAT), NOT the auto-provisioned GITHUB_TOKEN — which can only reach this source repo.
# No step writes to this repo's contents, so the default read-only GITHUB_TOKEN is sufficient.
permissions:
  contents: read

# Both platforms must build successfully before any asset is published. Windows produces
# self-contained .exe installers per RID; Android produces one release-signed APK. A single
# final job validates the complete three-file set and publishes it in one call.
#
# Android signing secrets (repo Settings -> Secrets and variables -> Actions). All four are
# required for a release tag; missing or invalid signing material fails the build and prevents
# every public release asset from being published:
#   ANDROID_KEYSTORE_BASE64   - base64 of your release keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD - keystore (store) password
#   ANDROID_KEY_ALIAS         - key alias
#   ANDROID_KEY_PASSWORD      - key password
# Generate once:  keytool -genkeypair -v -keystore printerapp.keystore -alias printerapp \
#                   -keyalg RSA -keysize 2048 -validity 10000
#   then:  base64 -i printerapp.keystore | pbcopy   (paste into ANDROID_KEYSTORE_BASE64)

jobs:
  # The two Windows RIDs ran sequentially in ONE job: 201s for x64 then 134s for x86,
  # behind a 170s workload restore — 554s of tag-to-release latency. They are
  # independent builds, so they are now a matrix and overlap.
  #
  # The trade is stated rather than hidden: this makes BILLING slightly WORSE, because
  # each leg pays its own 170s workload restore on a Windows runner (billed at 2x, each
  # job rounded up to the whole minute). Measured baseline ~20 billed min per release;
  # expect ~27. What it buys is ~164s off the time between pushing a tag and the
  # installer existing — which matters when the tag is a hotfix for a kitchen mid-service,
  # and not at all otherwise. If that ever stops being worth ~7 billed minutes, this is a
  # one-commit revert.
  #
  # Uploading is a separate job on purpose: two matrix legs racing to create the SAME
  # release tag in the releases repo is a real race, so the legs only produce artifacts
  # and one job publishes all three files only after every platform build succeeds.
  build-windows:
    runs-on: windows-latest
    strategy:
      # A failure in one arch must not cancel the other so both diagnostics are available.
      # The publish job still requires this entire matrix job to succeed.
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x' # matches global.json / net10.0 multi-target (ADR-005)

    - name: Restore MAUI workloads
      run: dotnet workload restore PrinterAPP/PrinterAPP.csproj

    # Run publish from the REPO ROOT (not `cd PrinterAPP`) so global.json — which pins the
    # .NET 10 SDK — is in the working dir and honored. Otherwise the SDK resolver can fall
    # back to the runner's preinstalled .NET 9, which doesn't recognize the net10.0-android
    # TFM the multi-target restore pulls in (NETSDK1139). Mirrors the working Android job.
    #
    # `-p:TargetFrameworks=...windows` pins the project to the single Windows TFM for this
    # invocation. Without it, the multi-target restore still processes net10.0-android even
    # with `-f`, and the `-r win-x64` RID leaks into it — trying to restore an Android Mono
    # runtime pack for win-x64 that doesn't exist (NU1102). Isolating to the Windows TFM
    # keeps the restore Windows-only.
    - name: Build and Publish (${{ matrix.rid }})
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: dotnet publish PrinterAPP/PrinterAPP.csproj -c Release -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:SentryDsn="$SENTRY_DSN" -o ./publish/${{ matrix.rid }}

    # The installer name is the auto-updater's contract: UpdateAssetSelector matches
    # "x64"/"x86" in the asset name and falls back to ANY .exe if it finds no arch match.
    # Renaming or dropping one of these is therefore not cosmetic — a 32-bit device that
    # finds no x86 asset would be offered the x64 installer it cannot run.
    - name: Rename Executable
      shell: pwsh
      run: |
        $arch = "${{ matrix.rid }}".Replace("win-", "")
        Rename-Item "publish/${{ matrix.rid }}/PrinterAPP.exe" "PrinterApp-Setup-$arch.exe"

    - name: Upload installer for the release job
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows-installer-${{ matrix.rid }}
        path: publish/${{ matrix.rid }}/PrinterApp-Setup-*.exe
        if-no-files-found: error
        retention-days: 7

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore MAUI workloads (android only on Linux — Windows TFM is OS-conditioned)
      run: dotnet workload restore PrinterAPP/PrinterAPP.csproj

    - name: Require and decode Android release signing material
      id: signing
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        for secret_name in \
          ANDROID_KEYSTORE_BASE64 \
          ANDROID_KEYSTORE_PASSWORD \
          ANDROID_KEY_ALIAS \
          ANDROID_KEY_PASSWORD; do
          if [[ -z "${!secret_name}" ]]; then
            echo "::error::Required Android release signing secret is missing: ${secret_name}"
            exit 1
          fi
        done

        umask 077
        keystore_path="$RUNNER_TEMP/printerapp.keystore"
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
        if [[ ! -s "$keystore_path" ]]; then
          echo "::error::The Android release keystore decoded to an empty file."
          exit 1
        fi
        echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

    - name: Publish release-signed APK
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: |
        set -euo pipefail
        dotnet publish PrinterAPP/PrinterAPP.csproj -c Release -f net10.0-android \
          -p:AndroidPackageFormat=apk \
          -p:SentryDsn="$SENTRY_DSN" \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore="${{ steps.signing.outputs.keystore_path }}" \
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
          -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
          -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
          -o ./android-publish

    - name: Collect exactly one signed APK
      run: |
        set -euo pipefail
        mapfile -d '' signed_apks < <(find ./android-publish -type f -name '*-Signed.apk' -print0)
        if [[ ${#signed_apks[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one release-signed APK; found ${#signed_apks[@]}."
          exit 1
        fi
        mkdir -p android-out
        cp -- "${signed_apks[0]}" android-out/PrinterApp-Android.apk

    - name: Remove release keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/printerapp.keystore"

    - name: Upload signed APK for the release job
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: android-signed-apk
        path: android-out/PrinterApp-Android.apk
        if-no-files-found: error
        retention-days: 7

  publish-release:
    # Default success() semantics intentionally skip publication unless BOTH platform
    # build jobs succeeded, including every Windows RID in its matrix.
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
    - name: Download both Windows installers
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: windows-installer-*
        merge-multiple: true
        path: release-assets

    - name: Download the signed Android APK
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: android-signed-apk
        path: release-assets

    - name: Validate the complete release asset set
      run: python3 scripts/verify_release_assets.py release-assets

    - name: Publish all release assets together
      uses: softprops/action-gh-release@v3
      with:
        repository: piwas-21/printer-app-releases
        tag_name: ${{ github.ref_name }}
        files: |
          release-assets/PrinterApp-Setup-x64.exe
          release-assets/PrinterApp-Setup-x86.exe
          release-assets/PrinterApp-Android.apk
        token: ${{ secrets.RELEASES_REPO_TOKEN }}
