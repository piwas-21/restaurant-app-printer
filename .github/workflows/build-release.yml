name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x' # Updated to match project's net9.0 target

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Build and Publish (x64)
      run: |
        cd PrinterAPP
        dotnet publish PrinterAPP.csproj -c Release -f net9.0-windows10.0.19041.0 -r win-x64 --self-contained -p:PublishSingleFile=true -o ./publish/x64

    - name: Build and Publish (x86)
      run: |
        cd PrinterAPP
        dotnet publish PrinterAPP.csproj -c Release -f net9.0-windows10.0.19041.0 -r win-x86 --self-contained -p:PublishSingleFile=true -o ./publish/x86

    - name: Rename Executables
      run: |
        cd PrinterAPP/publish
        ren x64\PrinterAPP.exe PrinterApp-Setup-x64.exe
        ren x86\PrinterAPP.exe PrinterApp-Setup-x86.exe

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          PrinterAPP/publish/x64/PrinterApp-Setup-x64.exe
          PrinterAPP/publish/x86/PrinterApp-Setup-x86.exe
        token: ${{ secrets.GITHUB_TOKEN }}
