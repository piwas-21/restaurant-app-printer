name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

# Releases publish to the PUBLIC piwas-21/printer-app-releases repo via RELEASES_REPO_TOKEN
# (a PAT), NOT the auto-provisioned GITHUB_TOKEN — which can only reach this source repo.
# No step writes to this repo's contents, so the default read-only GITHUB_TOKEN is sufficient.
permissions:
  contents: read

# Two independent jobs so a failure in one platform still releases the other.
# Windows -> self-contained .exe installers (consumed by the in-app auto-updater).
# Android -> a sideloadable .apk attached to the GitHub Release.
#
# Android signing secrets (repo Settings -> Secrets and variables -> Actions). If absent, the
# Android job falls back to a Debug-signed APK that installs for TESTING but is NOT for production:
#   ANDROID_KEYSTORE_BASE64   - base64 of your release keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD - keystore (store) password
#   ANDROID_KEY_ALIAS         - key alias
#   ANDROID_KEY_PASSWORD      - key password
# Generate once:  keytool -genkeypair -v -keystore printerapp.keystore -alias printerapp \
#                   -keyalg RSA -keysize 2048 -validity 10000
#   then:  base64 -i printerapp.keystore | pbcopy   (paste into ANDROID_KEYSTORE_BASE64)

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x' # matches global.json / net10.0 multi-target (ADR-005)

    - name: Restore MAUI workloads
      run: dotnet workload restore PrinterAPP/PrinterAPP.csproj

    # Run publish from the REPO ROOT (not `cd PrinterAPP`) so global.json — which pins the
    # .NET 10 SDK — is in the working dir and honored. Otherwise the SDK resolver can fall
    # back to the runner's preinstalled .NET 9, which doesn't recognize the net10.0-android
    # TFM the multi-target restore pulls in (NETSDK1139). Mirrors the working Android job.
    #
    # `-p:TargetFrameworks=...windows` pins the project to the single Windows TFM for this
    # invocation. Without it, the multi-target restore still processes net10.0-android even
    # with `-f`, and the `-r win-x64` RID leaks into it — trying to restore an Android Mono
    # runtime pack for win-x64 that doesn't exist (NU1102). Isolating to the Windows TFM
    # keeps the restore Windows-only.
    - name: Build and Publish (x64)
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: dotnet publish PrinterAPP/PrinterAPP.csproj -c Release -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64 --self-contained -p:PublishSingleFile=true -p:SentryDsn="$SENTRY_DSN" -o ./publish/x64

    - name: Build and Publish (x86)
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: dotnet publish PrinterAPP/PrinterAPP.csproj -c Release -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x86 --self-contained -p:PublishSingleFile=true -p:SentryDsn="$SENTRY_DSN" -o ./publish/x86

    - name: Rename Executables
      run: |
        ren publish\x64\PrinterAPP.exe PrinterApp-Setup-x64.exe
        ren publish\x86\PrinterAPP.exe PrinterApp-Setup-x86.exe

    - name: Upload Windows Release Assets
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        # Publish to the PUBLIC releases repo so the client (and the in-app updater)
        # can download without a GitHub account. Source stays private.
        repository: piwas-21/printer-app-releases
        # The tag was pushed to the source repo; name the release tag explicitly so it's
        # deterministic in the target repo (which has its own commit history).
        tag_name: ${{ github.ref_name }}
        files: |
          publish/x64/PrinterApp-Setup-x64.exe
          publish/x86/PrinterApp-Setup-x86.exe
        # Fine-grained PAT with Contents:read/write on piwas-21/printer-app-releases ONLY.
        # The default GITHUB_TOKEN can't reach another repo. See RELEASE_WORKFLOW.md.
        token: ${{ secrets.RELEASES_REPO_TOKEN }}

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore MAUI workloads (android only on Linux — Windows TFM is OS-conditioned)
      run: dotnet workload restore PrinterAPP/PrinterAPP.csproj

    - name: Decode signing keystore (if configured)
      id: keystore
      env:
        KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/printerapp.keystore"
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building a Debug-signed APK (testing only, not for production)."
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish signed Release APK
      if: steps.keystore.outputs.present == 'true'
      env:
        STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: |
        dotnet publish PrinterAPP/PrinterAPP.csproj -c Release -f net10.0-android \
          -p:AndroidPackageFormat=apk \
          -p:SentryDsn="$SENTRY_DSN" \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/printerapp.keystore" \
          -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
          -p:AndroidSigningStorePass="$STORE_PASS" \
          -p:AndroidSigningKeyPass="$KEY_PASS" \
          -o ./android-publish

    - name: Build Debug APK (no release keystore — testing only)
      if: steps.keystore.outputs.present == 'false'
      run: |
        dotnet publish PrinterAPP/PrinterAPP.csproj -c Debug -f net10.0-android \
          -p:AndroidPackageFormat=apk \
          -o ./android-publish

    - name: Collect APK
      run: |
        mkdir -p android-out
        apk=$(find ./android-publish -name "*-Signed.apk" | head -1)
        if [ -z "$apk" ]; then apk=$(find ./android-publish -name "*.apk" | head -1); fi
        if [ -z "$apk" ]; then echo "No APK produced" && exit 1; fi
        cp "$apk" "android-out/PrinterApp-Android.apk"
        ls -la android-out

    - name: Upload Android Release Asset
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        repository: piwas-21/printer-app-releases
        tag_name: ${{ github.ref_name }}
        files: android-out/PrinterApp-Android.apk
        token: ${{ secrets.RELEASES_REPO_TOKEN }}
