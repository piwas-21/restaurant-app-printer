name: CI

# Phase 0 hygiene gates ported from .gitlab-ci.yml. Out-of-scope today
# (need a Windows runner): dotnet build / format / test for the MAUI
# Windows TFM. Sprint 2 wires those once a Windows runner is available.
#
# Security: this workflow uses no untrusted input from PR titles, bodies,
# branch names, etc. — only static commands and secrets.GITHUB_TOKEN.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  file_length:
    name: file-length (CLAUDE.md §4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-file-length.sh --all

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the binary directly — gitleaks-action requires a paid license
      # for organizations ($200+/yr); the OSS CLI is free under the MIT
      # license and does the same scan.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             | tar -xzf - -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --verbose --redact --source .
