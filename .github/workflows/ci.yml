name: CI

# Phase 0 hygiene gates ported from .gitlab-ci.yml + 2026-05-05 hardening
# (DeelMarkt-borrowed: SHA-pinned actions, concurrency cancellation,
# timeout caps, TruffleHog + Trivy filesystem scan).
#
# Unit tests run here on Linux: PrinterAPP.Tests targets plain net10.0 with
# source-linked transport files, so it needs no MAUI workloads and no Windows.
# Still out-of-scope (need a Windows runner): dotnet build / format for the
# MAUI Windows TFM — build-windows.{sh,ps1} remains the pre-merge source of
# truth for the app heads.
#
# Security: this workflow uses no untrusted-input expressions
# (PR title/body/branch/commit) in run: commands. All inputs are
# either secrets.GITHUB_TOKEN or static literals. All third-party
# actions are pinned to immutable SHAs.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel stale runs when a new push lands on the same PR — saves
# free-tier Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet_test:
    name: dotnet test (PrinterAPP.Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x' # matches global.json (10.0.101, rollForward latestFeature)
      # Target the test .csproj, NEVER the .sln — the sln pulls in the MAUI
      # app head, which needs workloads (and Windows for the Windows TFM).
      # The test project is plain net10.0 and runs on a bare Linux runner.
      # Run from repo root so global.json governs SDK resolution.
      - name: Run unit tests
        run: dotnet test PrinterAPP.Tests/PrinterAPP.Tests.csproj -c Release --nologo

      # BUILD only, never test: the E2E cases are SkippableFact-gated on a reachable backend and
      # would all skip here, which buys nothing and invites someone to "fix" the skips later.
      # The point is compilation. PrinterAPP.E2E is not in the .sln and its own workflow runs on a
      # schedule, so when it source-links a PrinterAPP/** file whose signature changed, the break was
      # invisible to the PR that caused it and surfaced days later, detached from its cause. That
      # happened with the IFeedCursorStore constructor change.
      - name: Build E2E project (compile-only guard on source-linked files)
        run: dotnet build PrinterAPP.E2E/PrinterAPP.E2E.csproj -c Release --nologo

  # One job, four scans. GitHub bills each JOB rounded up to the whole minute, so
  # file-length (3-6s) + gitleaks (7-12s) + TruffleHog (11-14s) + Trivy (9-31s)
  # used to cost 4 billed minutes to do 30-63 seconds of work — on a repo that is
  # private and therefore billed. Their summed duration is shorter than the
  # dotnet_test job in every sampled run, so serialising them costs zero wall clock.
  #
  # Nothing is removed, weakened or re-scoped: every scan keeps its own SHA-pinned
  # action, its own arguments and its own severity threshold. `!cancelled()` on each
  # step preserves the one property the split gave us for free — a gitleaks hit must
  # not hide the Trivy result — so a failing scan still reports every other scan's
  # findings in the same log, and the job still fails.
  checks:
    name: hygiene + secret + misconfig scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole tree and TruffleHog diffs base..head — both need history.
          fetch-depth: 0

      - name: file-length (CLAUDE.md §4)
        if: ${{ !cancelled() }}
        run: bash scripts/check-file-length.sh --all

      # Use the binary directly — gitleaks-action requires a paid license
      # for organizations ($200+/yr); the OSS CLI is free under the MIT
      # license and does the same scan.
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xzf - -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: gitleaks (secret scan)
        if: ${{ !cancelled() }}
        run: gitleaks detect --verbose --redact --source .

      # Complementary to gitleaks, and only on PRs — TruffleHog's diff-scan needs
      # BASE != HEAD. On a push to main/develop, BASE (default branch) == HEAD, which
      # the action errors on. Gitleaks already does the full-filesystem secret scan on
      # every push, so coverage doesn't regress.
      - name: TruffleHog (secret scan, complementary to gitleaks)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Trivy filesystem (misconfig + secrets)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Match the policy we had on Trivy image scans: HIGH/CRITICAL block.
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Don't fetch DB inside an action runtime that may rate-limit;
          # the action handles caching itself.
          ignore-unfixed: true
