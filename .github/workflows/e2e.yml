# Printer-app E2E — fleet telemetry + order-feed + reconciliation against a REAL backend (no mocks).
# See docs/E2E-STRATEGY.md. Deliberately NOT on push/PR (keeps the fast unit job hermetic + a flaky
# backend from blocking merges). Runs weekly for drift detection and on demand.
#
# Two targets, selected by the `target` dispatch input (default staging):
#   • staging — the always-on subset (telemetry + order-feed poll/auth). Staging ships 0 products, so
#     the order-creation tests (delivery + missed-order reconciliation) SKIP. Uses repo-level secrets.
#   • demo    — the SEEDED backend, so the full suite runs incl. delivery + reconciliation. Uses the
#     `demo` GitHub Environment's secrets (a distinct X-Api-Key + admin credentials for that tenant).
#
# Admin auth is minted at runtime from PRINTERAPP_E2E_ADMIN_{EMAIL,PASSWORD} via POST /api/auth/login
# (a static JWT would expire and red-fail the weekly run); PRINTERAPP_E2E_ADMIN_JWT is an optional
# direct override for a one-off run.
name: e2e (fleet telemetry)

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC — staging drift check (subset)
  workflow_dispatch:
    inputs:
      target:
        description: "Which backend to test (selects its GitHub Environment + secrets)"
        type: choice
        options: [staging, demo]
        default: staging
      api_base_url:
        description: "Override the backend base URL (optional; else derived from target)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (fleet telemetry)
    runs-on: ubuntu-latest
    # demo → the `demo` Environment (its own X-Api-Key + admin creds); staging/schedule → no environment
    # (repo-level secrets). An empty string means "no environment".
    environment: ${{ github.event.inputs.target == 'demo' && 'demo' || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x" # matches global.json

      - name: Run E2E suite
        env:
          # Base URL: explicit override → demo default when target=demo → repo var → staging default.
          PRINTERAPP_E2E_API_BASE_URL: ${{ github.event.inputs.api_base_url || (github.event.inputs.target == 'demo' && 'https://demo.sofrapiwas.com') || vars.PRINTERAPP_E2E_API_BASE_URL || 'https://staging.fooderist.com' }}
          # X-Api-Key for the tenant's printer feed / device telemetry (env-scoped when target=demo).
          PRINTERAPP_E2E_API_KEY: ${{ secrets.PRINTERAPP_E2E_API_KEY }}
          # Admin auth: minted at runtime from these creds; JWT is an optional direct override.
          PRINTERAPP_E2E_ADMIN_EMAIL: ${{ secrets.PRINTERAPP_E2E_ADMIN_EMAIL }}
          PRINTERAPP_E2E_ADMIN_PASSWORD: ${{ secrets.PRINTERAPP_E2E_ADMIN_PASSWORD }}
          PRINTERAPP_E2E_ADMIN_JWT: ${{ secrets.PRINTERAPP_E2E_ADMIN_JWT }}
          PRINTERAPP_E2E_TENANT_SLUG: ${{ vars.PRINTERAPP_E2E_TENANT_SLUG || 'rumi' }}
        run: dotnet test PrinterAPP.E2E/PrinterAPP.E2E.csproj -c Release --nologo
