name: Security Audit (Weekly)

# Cadence: every Monday 06:00 UTC (+ manual dispatch).
# Purpose: run the heavier, slower security scans on a schedule instead of on
# every PR — keeps PR latency low while still catching newly-disclosed CVEs in
# code that hasn't changed, plus secrets that predate per-PR scanning.
#
# Design note — NO WINDOWS RUNNER REQUIRED:
# printer-app is a .NET MAUI 10 multi-target app (net10.0-android; Windows TFM
# is OS-conditioned away on Linux — ADR-005), and Windows runners are scarce
# (CodeQL is deferred for the same reason, see issue #4). Every job here runs on
# ubuntu-latest and scans the source tree / NuGet manifest without building the
# app. The NuGet vulnerability audit DOES need `dotnet workload restore` first:
# since the ADR-005 multi-target, plain restore fails NETSDK1147 (maui-android
# workload missing) — the same workload-restore the release workflow's Android
# job uses. On Linux only the android workload is pulled (~2 min).
#
# Security: this workflow uses no untrusted-input expressions (PR title/body/
# branch/commit) in run: commands — there is no PR context on a schedule. All
# inputs are static literals or secrets.GITHUB_TOKEN. All third-party actions are
# pinned to immutable SHAs (matching .github/workflows/ci.yml).
#
# Failure model: scheduled runs FAIL (red ❌) on findings so the failure is a
# visible signal on the Actions tab. No issue-creation automation.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Only one weekly audit at a time; a manual dispatch supersedes an in-flight run.
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv_scanner:
    name: OSV-Scanner (full-tree dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Full-tree scan of every manifest in the repo. Non-zero exit on any
      # vulnerability finding fails the job.
      - uses: google/osv-scanner-action/osv-scanner-action@6fc714450122bda9d00e4ad5d639ad6a39eedb1f # v2.0.1
        with:
          scan-args: |-
            --recursive
            ./

  trivy_fs:
    name: Trivy filesystem (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  gitleaks:
    name: gitleaks (full-history secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history — catches secrets committed before per-PR scanning was
          # adopted, which the per-PR (diff-scoped) gate never sees.
          fetch-depth: 0
      # Use the OSS CLI directly — gitleaks-action needs a paid org license; the
      # binary is free under MIT and runs the same scan (matches ci.yml).
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xzf - -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks (full history)
        run: gitleaks detect --verbose --redact --source .

  nuget_vuln_audit:
    name: NuGet vulnerability audit (dotnet list --vulnerable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x' # matches global.json / net10.0 multi-target (ADR-005)
      # Multi-target restore needs the maui-android workload (NETSDK1147
      # otherwise); on Linux the Windows TFM is OS-conditioned away, so this
      # pulls android only — mirrors build-release.yml's Android job. The
      # assets file it writes is what `dotnet list package --vulnerable` reads.
      - name: Restore MAUI workloads
        run: dotnet workload restore PrinterAPP/PrinterAPP.csproj
      - name: Restore
        run: dotnet restore PrinterAPP/PrinterAPP.csproj
      - name: Audit vulnerable packages (direct + transitive)
        run: |
          dotnet list PrinterAPP/PrinterAPP.csproj package --vulnerable --include-transitive 2>&1 \
            | tee vuln-report.txt
          echo "## NuGet vulnerability audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat vuln-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `dotnet list package --vulnerable` exits 0 even when it finds
          # vulnerabilities, so grep the report and fail the scheduled run on any
          # advisory severity. The leading ">" marks a package row in the output.
          if grep -qiE '> .*(Critical|High|Moderate|Low)' vuln-report.txt; then
            echo "::error::Vulnerable NuGet package(s) found — see job summary."
            exit 1
          fi
          echo "No vulnerable NuGet packages found."
