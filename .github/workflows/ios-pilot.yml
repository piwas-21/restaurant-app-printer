name: iOS foreground pilot

on:
  pull_request:
    paths:
      - 'PrinterAPP/**'
      - 'build-ios.sh'
      - '.github/workflows/ios-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios_compile:
    name: compile iOS pilot (simulator only)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.401'
      - name: Select matching Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - name: Install iOS MAUI workload
        run: dotnet workload install maui-ios --version 10.0.401.1
      - name: Compile Release simulator app
        run: bash build-ios.sh simulator
      - name: Archive simulator app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent PrinterAPP/bin/Release/net10.0-ios/iossimulator-arm64/PrinterAPP.app ios-simulator-pilot.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-pilot
          path: ios-simulator-pilot.zip
          if-no-files-found: error
